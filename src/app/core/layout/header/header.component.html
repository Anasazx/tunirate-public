<header class="bg-white border-b sticky top-0 z-50">

  <div
    class="max-w-6xl mx-auto px-4
         flex flex-col gap-2 py-2
         md:h-16 md:grid md:grid-cols-3
         md:gap-0 md:py-0 md:items-center"
  >


    <!-- TOP ROW MOBILE / LEFT DESKTOP -->
    <div
      class="flex items-center w-full h-10
         gap-1
         md:justify-self-start"
    >

      <!-- Burger -->

      <button
        (click)="toggleMobileMenu()"
        class="p-1.5 rounded-lg hover:bg-slate-100 transition md:hidden"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 text-slate-700"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>

      </button>

      <!-- LOGO -->
      <a
        routerLink="/"
        class="font-semibold text-lg text-slate-900"
      >
        ReviewHub
      </a>


      <!-- MOBILE USER ACTIONS -->
      <div class="flex items-center gap-2 ml-auto md:hidden">

        <ng-container *ngIf="authService.currentUser$ | async as user; else mobileGuest">


          <!-- Notification -->
          <button
            (click)="toggleInvitations(); $event.stopPropagation()"
            class="relative p-2 rounded-full hover:bg-gray-100 transition">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-6 h-6 text-gray-700"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">

              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0m6 0H9" />

            </svg>


            <span
              *ngIf="invitationCount > 0"
              class="absolute -top-1 -right-1
                     min-w-[18px] h-[18px]
                     flex items-center justify-center
                     text-[10px] font-bold
                     bg-red-500 text-white
                     rounded-full px-1">

              {{ invitationCount }}

            </span>

          </button>


          <!-- Avatar -->
          <button
            (click)="toggleUserMenu(); $event.stopPropagation()"
            class="p-1 rounded-full hover:bg-gray-100">

            <img
              [src]="user.avatarUrl | imageUrl"
              class="w-8 h-8 rounded-full object-cover border">

          </button>


        </ng-container>


        <ng-template #mobileGuest>

          <a

            routerLink="/auth/login"

            class="

      text-sm font-medium

      text-slate-700

      px-2 py-1

      hover:text-slate-900

      transition

    ">

            Sign in

          </a>

        </ng-template>


      </div>

    </div>



    <app-search-bar></app-search-bar>




    <!-- DESKTOP USER MENU -->
    <div
      class="hidden md:flex
         justify-self-end
         items-center gap-3">


      <!-- AUTH STATE -->
      <ng-container *ngIf="authService.currentUser$ | async as user; else desktopGuest">


        <!-- NOTIFICATIONS -->
        <div class="relative notification-menu">

          <button
            (click)="toggleInvitations(); $event.stopPropagation()"
            class="relative p-2 rounded-full hover:bg-slate-100 transition">


            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-6 h-6 text-slate-700"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">

              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0m6 0H9" />

            </svg>


            <span
              *ngIf="invitationCount > 0"
              class="absolute -top-1 -right-1
                 min-w-[18px] h-[18px]
                 flex items-center justify-center
                 text-[10px] font-bold
                 bg-red-500 text-white
                 rounded-full px-1">

          {{ invitationCount }}

        </span>


          </button>



          <!-- INVITATIONS DROPDOWN -->
          <div
            *ngIf="showInvitations"
            class="absolute right-0 top-full mt-2
               w-80
               bg-white border
               rounded-xl
               shadow-lg
               z-50">


            <div class="p-4 border-b font-semibold">
              Invitations
            </div>


            <div
              *ngIf="invitations.length === 0"
              class="p-4 text-sm text-gray-500">

              No invitations.

            </div>


            <div
              *ngFor="let invitation of invitations"
              class="p-4 border-b">

              {{ invitation.company.name }}

            </div>


          </div>


        </div>




        <!-- USER DROPDOWN -->
        <div class="relative user-menu">


          <button
            (click)="toggleUserMenu(); $event.stopPropagation()"
            class="flex items-center gap-2
               px-3 py-2
               rounded-full
               hover:bg-slate-100
               transition">


            <img
              [src]="user.avatarUrl | imageUrl"
              class="w-8 h-8 rounded-full object-cover border"
            />


            <span class="text-sm font-medium text-slate-700">
          {{ user.name }}
        </span>


          </button>




          <!-- USER MENU -->
          <div
            *ngIf="userMenuOpen"
            class="absolute right-0 mt-2
               w-48
               bg-white border
               rounded-xl
               shadow-lg
               overflow-hidden
               z-50">


            <a
              routerLink="/account"
              class="block px-4 py-2 text-sm hover:bg-gray-100">

              My account

            </a>


            <a
              *ngIf="authService.isCompanyMember()"
              (click)="goCompanyDashboard()"
              class="block px-4 py-2 text-sm hover:bg-gray-100">

              Company Dashboard

            </a>


            <button
              (click)="logout()"
              class="w-full text-left
                 px-4 py-2
                 text-sm
                 text-red-600
                 hover:bg-red-50">

              Logout

            </button>


          </div>


        </div>


      </ng-container>





      <!-- GUEST -->
      <ng-template #desktopGuest>

        <a
          routerLink="/auth/login"
          class="text-sm font-medium
             text-slate-700
             hover:text-slate-900
             transition">

          Sign in

        </a>


      </ng-template>


    </div>


  </div>


  <div class="hidden md:block">
    <app-navbar></app-navbar>
  </div>

  <div class="md:hidden">
    <app-mobile-sidebar
      [open]="mobileMenuOpen"
      (close)="mobileMenuOpen = false">
    </app-mobile-sidebar>  </div>

</header>
