<div
  *ngIf="open"
  class="fixed inset-0 z-[100] md:hidden"
>

  <!-- Overlay -->
  <div
    class="absolute inset-0 bg-black/30"
    (click)="close.emit()">
  </div>


  <!-- Sidebar -->
  <aside
    class="
      absolute left-0 top-0
      h-full w-72
      bg-white
      p-5
      shadow-xl
      overflow-y-auto
    "
  >

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">

      <span class="text-lg font-semibold text-slate-900">
        Categories
      </span>

      <button
        (click)="close.emit()"
        class="rounded-lg p-2 hover:bg-slate-100"
      >
        ✕
      </button>

    </div>


    <!-- Categories -->
    <nav class="space-y-3">

      <!-- All -->
      <a
        routerLink="/products"
        (click)="close.emit()"
        class="block rounded-lg px-3 py-2 text-sm font-medium transition"

        [class.bg-slate-900]="!currentCategory"
        [class.text-white]="!currentCategory"

        [class.bg-transparent]="currentCategory"
        [class.text-slate-700]="currentCategory"
        [class.hover:bg-slate-100]="currentCategory"
      >
        All
      </a>


      <!-- Beauty Subcategories -->
      <div
        *ngIf="beautyCategory"
        class="space-y-1"
      >

        <a
          *ngFor="let sub of beautySubcategories"

          routerLink="/products"

          [queryParams]="{
            subcategoryId: sub.id,
            subcategory: sub.name
          }"

          (click)="close.emit()"

          class="
            block
            rounded-lg
            px-3
            py-2
            text-sm
            font-medium
            transition
          "

          [class.bg-slate-900]="currentSubcategory === sub.name"
          [class.text-white]="currentSubcategory === sub.name"

          [class.text-slate-700]="currentSubcategory !== sub.name"
          [class.hover:bg-slate-100]="currentSubcategory !== sub.name"
        >

          {{ sub.name }}

        </a>

      </div>

    </nav>

  </aside>

</div>
