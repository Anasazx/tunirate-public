<div class="relative bg-white border border-slate-200 rounded-2xl p-6 text-center">

  <button
    (click)="close.emit()"
    class="absolute top-4 right-4 p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
    aria-label="Close">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

  <div
    class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-slate-100">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-7 w-7 text-slate-600"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 15v2m6-7V8a6 6 0 10-12 0v2m-1 0h14a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2z"/>

    </svg>

  </div>
  <h3 class="text-lg font-bold text-slate-900">
    Sign in to continue
  </h3>
  <p class="mt-2 text-sm text-slate-500">
    {{ message }}
  </p>
  <div class="mt-6 flex flex-col sm:flex-row gap-3">
    <button
      [routerLink]="['/auth/login']"
      class="flex-1 rounded-xl bg-slate-900 py-2.5 text-sm font-semibold text-white hover:bg-slate-700">
      Sign In
    </button>
    <button
      [routerLink]="['/auth/register']"
      class="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
      Create Account
    </button>
  </div>

</div>
