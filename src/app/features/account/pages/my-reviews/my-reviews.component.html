<div class="space-y-6">

  <!-- HEADER -->
  <div>
    <h2 class="text-lg font-semibold text-gray-800">My Reviews</h2>
    <p class="text-sm text-gray-500">
      All reviews you’ve written
    </p>
  </div>

  <!-- REVIEWS LIST -->
  <div class="space-y-4">

    <!-- EMPTY STATE -->
    <div *ngIf="!reviews?.length" class="text-center py-10 border rounded-xl">
      <p class="text-gray-500 text-sm">
        You haven’t written any reviews yet.
      </p>
    </div>

    <!-- REVIEW ITEM -->
    <div
      *ngFor="let review of reviews"
      class="border rounded-xl p-4 space-y-2 hover:shadow-sm transition">

      <!-- TOP -->
      <div class="flex justify-between items-start">

        <div>
          <p class="font-medium text-gray-800">
            {{ review.productName }}
          </p>

          <p class="text-xs text-gray-500">
            {{ review.createdAt | date:'mediumDate' }}
          </p>
        </div>

        <!-- RATING -->
        <div class="text-yellow-500 text-sm font-medium">
          ★ {{ review.rating }}/5
        </div>

      </div>

      <!-- CONTENT -->
      <p class="text-sm text-gray-600">
        {{ review.content }}
      </p>

      <!-- ACTIONS -->
      <div class="flex justify-end gap-3 pt-2">

        <button
          class="text-xs text-gray-400 hover:text-gray-700 transition"
          routerLink="/product/{{ review.productId }}"
        >
          Go to review
        </button>

      </div>

    </div>

  </div>

</div>
