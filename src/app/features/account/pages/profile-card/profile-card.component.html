<div *ngIf="user" class="space-y-6">

  <!-- PROFILE HEADER -->
  <div class="flex items-center gap-4">

    <img
      [src]="sharedService.getImageUrl(user.avatarUrl)"
      class="w-16 h-16 rounded-full border object-cover"
    />

    <div>
      <h2 class="text-lg font-semibold text-gray-800">
        {{ user.name }}
      </h2>

      <span class="inline-block mt-1 px-2 py-0.5 text-xs rounded-full bg-gray-100 text-gray-600">
        {{ user.status }}
      </span>
    </div>

  </div>

  <!-- INFO OR EDIT MODE -->
  <div *ngIf="!editing; else editForm">

    <!-- VIEW MODE -->
    <div class="divide-y border rounded-xl overflow-hidden text-sm">

      <!-- PHONE -->
      <div class="flex justify-between items-center px-4 py-3">

        <div class="flex flex-col">
          <span class="text-gray-500">Phone</span>
          <span class="font-medium text-gray-800">
        {{ user.phoneNumber || 'Not provided' }}
      </span>
        </div>

      </div>

      <!-- COUNTRY -->
      <div class="flex justify-between items-center px-4 py-3">

        <div class="flex flex-col">
          <span class="text-gray-500">Country</span>
          <span class="font-medium text-gray-800">
        {{ user.country || 'Not provided' }}
      </span>
        </div>

      </div>

      <!-- EMAIL + BADGE -->
      <div class="flex justify-between items-center px-4 py-3">

        <div class="flex flex-col">
          <span class="text-gray-500">Email</span>
          <span class="font-medium text-gray-800">
        {{ user.email }}
      </span>
        </div>

        <span
          class="px-2 py-1 text-xs rounded-full font-medium"
          [ngClass]="user.emailVerified
        ? 'bg-green-100 text-green-700'
        : 'bg-yellow-100 text-yellow-700'"
        >
      {{ user.emailVerified ? 'Verified' : 'Not verified' }}
    </span>

      </div>

      <!-- JOINED -->
      <div class="flex justify-between items-center px-4 py-3">

        <div class="flex flex-col">
          <span class="text-gray-500">Joined</span>
          <span class="font-medium text-gray-800">
        {{ user.createdAt | date:'mediumDate' }}
      </span>
        </div>

      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-3 pt-4">

      <button
        (click)="startEdit(user)"
        class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200">
        Edit Profile
      </button>

      <button class="px-4 py-2 text-sm bg-red-50 text-red-600 rounded-lg hover:bg-red-100">
        Delete Account
      </button>

    </div>

  </div>

  <!-- EDIT MODE -->
  <ng-template #editForm>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">

      <input [(ngModel)]="editModel.phoneNumber"
             placeholder="Phone"
             class="border p-2 rounded-lg"/>

      <input [(ngModel)]="editModel.country"
             placeholder="Country"
             class="border p-2 rounded-lg"/>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-3 pt-3">

      <button (click)="save()"
              class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        Save
      </button>

      <button (click)="cancelEdit()"
              class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200">
        Cancel
      </button>

    </div>

  </ng-template>

</div>
