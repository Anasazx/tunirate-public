<!-- LEFT SIDEBAR -->
<div
  *ngIf="authService.currentUser$ | async as user"
  class="md:col-span-1 bg-white border rounded-xl p-4 h-fit sticky top-20"
>

  <div class="flex flex-col items-center text-center mb-6">
      <img [src]="sharedService.getImageUrl(user.avatarUrl)" class="w-20 h-20 rounded-full border object-cover" />

    <h2 class="mt-3 font-semibold text-gray-800">
      {{ user.name }}
    </h2>
  </div>

  <nav class="space-y-2 text-sm">

    <a
      routerLink="/account/profile"
      routerLinkActive="bg-gray-100 font-medium"
      [routerLinkActiveOptions]="{ exact: true }"
      class="block px-3 py-2 rounded-lg hover:bg-gray-100"
    >
      Profile
    </a>

    <a
      routerLink="/account/reviews"
      routerLinkActive="bg-gray-100 font-medium"
      class="block px-3 py-2 rounded-lg hover:bg-gray-100"
    >
      My Reviews
    </a>

    <a
      routerLink="/account/security"
      routerLinkActive="bg-gray-100 font-medium"
      class="block px-3 py-2 rounded-lg hover:bg-gray-100"
    >
      Security
    </a>

  </nav>

</div>
