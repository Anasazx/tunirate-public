<!-- HEADER -->
<app-account-header
  (menuToggle)="sidebarOpen = !sidebarOpen">
</app-account-header>


<!-- PAGE -->
<div class="bg-gray-50 min-h-[calc(100vh-56px)] py-8">

  <div
    class="
      max-w-6xl
      mx-auto
      px-4
      flex
      gap-6
      items-start
    "
  >


    <!-- DESKTOP SIDEBAR -->
    <aside
      class="
        hidden
        md:block
        w-64
        flex-shrink-0
      "
    >

      <div
        class="
          bg-white
          border
          border-slate-200
          rounded-2xl
          p-4
          shadow-sm
        "
      >

        <app-account-sidebar></app-account-sidebar>

      </div>

    </aside>



    <!-- MOBILE DRAWER -->
    <div
      *ngIf="sidebarOpen"
      class="
        fixed
        inset-0
        z-50
        md:hidden
      "
    >

      <!-- BACKDROP -->
      <div
        class="
          absolute
          inset-0
          bg-black/30
          backdrop-blur-sm
        "
        (click)="sidebarOpen=false">
      </div>


      <!-- DRAWER -->
      <aside
        class="
          absolute
          left-0
          top-0
          h-full
          w-72
          bg-white
          shadow-xl
          p-4
        "
      >

        <app-account-sidebar
          (closeSidebar)="sidebarOpen=false">
        </app-account-sidebar>

      </aside>


    </div>



    <!-- CONTENT -->
    <main
      class="
        flex-1
        w-full
      "
    >

      <div
        class="
          bg-white
          border
          border-slate-200
          rounded-2xl
          p-5
          md:p-6
          shadow-sm
        "
      >

        <router-outlet></router-outlet>

      </div>

    </main>


  </div>

</div>
