<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-6">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8">

    <!-- Icon -->
    <div

      class="w-14 h-14 sm:w-16 sm:h-16 mx-auto rounded-full flex items-center justify-center"

      [class.bg-sky-100]="!success"

      [class.bg-green-100]="success">

      <ng-container *ngIf="!success">

        <!-- Mail icon -->

        <svg xmlns="http://www.w3.org/2000/svg"

             class="w-7 h-7 sm:w-8 sm:h-8 text-sky-600"

             fill="none"

             viewBox="0 0 24 24"

             stroke="currentColor">

          <path

            stroke-linecap="round"

            stroke-linejoin="round"

            stroke-width="2"

            d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2"/>

        </svg>

      </ng-container>

      <ng-container *ngIf="success">

        <!-- Check icon -->

        <svg xmlns="http://www.w3.org/2000/svg"

             class="w-7 h-7 sm:w-8 sm:h-8 text-green-600"

             fill="none"

             viewBox="0 0 24 24"

             stroke="currentColor">

          <path

            stroke-linecap="round"

            stroke-linejoin="round"

            stroke-width="2"

            d="M5 13l4 4L19 7"/>

        </svg>

      </ng-container>

    </div>


    <h1 class="mt-5 sm:mt-6 text-2xl sm:text-3xl font-bold text-center text-slate-900">
      {{ success ? 'Email Verified!' : 'Verify your email' }}
    </h1>


    <p class="mt-3 text-sm sm:text-base text-center text-slate-500 leading-relaxed">
      <ng-container *ngIf="!success">
        We sent a verification code to
        <br>
        <span class="font-semibold text-slate-700 break-all">
      {{ email }}
    </span>
      </ng-container>
      <ng-container *ngIf="success">
      <div class="mt-8">
        Your email has been successfully verified.
        <br>
        Redirecting...
      </div>
    </ng-container>
    </p>


    <!-- OTP -->
    <div *ngIf="!success" class="mt-8 flex justify-center gap-2 sm:gap-3">

      <input
        #codeInput
        *ngFor="let digit of digits; let i = index; trackBy: trackByIndex"
        type="text"
        maxlength="1"
        inputmode="numeric"
        autocomplete="one-time-code"
        [value]="digits[i]"
        (input)="moveNext($event, i)"
        (keydown)="backspace($event, i)"
        (paste)="paste($event)"
        class="w-10 h-12 sm:w-12 sm:h-14 rounded-xl border text-xl sm:text-2xl font-semibold text-center outline-none focus:ring-2 focus:ring-sky-500">
    </div>


    <button
      *ngIf="!success"
      (click)="verify()"
      [disabled]="loading"
      class="mt-8 w-full h-11 sm:h-12 rounded-xl bg-sky-600 text-white text-sm sm:text-base font-semibold hover:bg-sky-700 transition disabled:opacity-50">

      {{ loading ? 'Verifying...' : 'Verify Email' }}

    </button>


    <div *ngIf="!success" class="mt-6 text-center text-xs sm:text-sm text-slate-500">

      Didn't receive the code?

      <button
        (click)="resend()"
        [disabled]="!canResend"
        class="ml-1 font-semibold text-sky-600 hover:text-sky-700 disabled:text-slate-400 disabled:cursor-not-allowed">
        {{ canResend ? 'Resend' : 'Resend in ' + resendCooldown + 's' }}
      </button>


      <p
        *ngIf="error"
        class="mt-4 text-red-500">
        {{ error }}
      </p>

    </div>

  </div>

</div>
